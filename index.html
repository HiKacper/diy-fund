<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>DIY Fund — Family Investing</title>
<meta name="description" content="A private family investment practice tracker." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0a0a0f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DIY Fund" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --surface:#12141c;
    --surface-2:#181c27;
    --surface-3:#1f2430;
    --border:#232733;
    --border-soft:#1a1e28;
    --text:#e9ebf1;
    --text-dim:#9299ac;
    --text-faint:#5c6376;
    --accent:#3b82f6;
    --accent-2:#60a5fa;
    --accent-dim:#1d4ed8;
    --accent-soft:rgba(59,130,246,.14);
    --green:#22c55e;
    --green-soft:rgba(34,197,94,.13);
    --red:#f0554a;
    --red-soft:rgba(240,85,74,.13);
    --amber:#e0a336;
    --amber-soft:rgba(224,163,54,.13);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --font-num:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-ui);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    overscroll-behavior-y:none;
  }
  #app{max-width:520px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:84px;}
  @media (min-width:900px){
    #app{max-width:none;display:grid;grid-template-columns:220px 1fr;min-height:100vh;padding-bottom:0;}
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}
  .num{font-family:var(--font-num);font-variant-numeric:tabular-nums;}
  .hidden{display:none !important;}
 
  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 10px;
  }
  .brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;letter-spacing:-0.01em;}
  .brand .mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:end;gap:2px;padding:5px 4px 4px;}
  .brand .mark i{display:block;width:4px;background:var(--bg);border-radius:1px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .icon-btn{
    width:36px;height:36px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface);color:var(--text-dim);display:flex;align-items:center;justify-content:center;
    font-size:16px;
  }
  .icon-btn:active{background:var(--surface-2);}
  .profile-switch{
    display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);
    border-radius:11px;padding:6px 10px 6px 6px;font-size:13px;font-weight:600;color:var(--text);
  }
  .profile-switch .avatar{width:22px;height:22px;border-radius:7px;background:var(--accent-soft);color:var(--accent-2);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
 
  main{padding:4px 16px 30px;}
 
  /* ---------- Cards ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;}
  .card-sm{border-radius:var(--radius-md);padding:14px;}
  .card-title{font-size:13px;font-weight:650;color:var(--text);margin:0 0 10px;}
  .row{display:flex;align-items:center;justify-content:space-between;}
  .stack{display:flex;flex-direction:column;gap:10px;}
 
  /* Goal card */
  .goal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;}
  .goal-name{font-size:13px;font-weight:650;color:var(--text);}
  .goal-count{font-size:12.5px;color:var(--accent-2);font-weight:600;margin-top:2px;}
  .goal-bar-track{height:7px;border-radius:5px;background:var(--surface-3);overflow:hidden;margin:10px 0 12px;}
  .goal-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:5px;}
 
  /* Home timeline: start → today → target date */
  .timeline-track{position:relative;height:7px;border-radius:5px;background:var(--surface-3);margin:30px 0 10px;}
  .timeline-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:5px;}
  .timeline-marker{position:absolute;top:50%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);box-shadow:0 0 0 2px var(--accent);}
  .timeline-marker-label{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--accent-2);white-space:nowrap;}
  .timeline-dates{display:flex;justify-content:space-between;font-size:11px;color:var(--text-faint);}
  .goal-figs{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);}
  .goal-figs b{color:var(--text);font-family:var(--font-num);font-weight:650;}
 
  /* Hero value */
  .hero-value{font-size:34px;font-weight:750;letter-spacing:-0.02em;font-family:var(--font-num);}
  .hero-delta{font-size:13.5px;font-weight:650;margin-top:2px;}
  .delta-up{color:var(--green);} .delta-down{color:var(--red);} .delta-flat{color:var(--text-dim);}
  .price-meta{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .refresh-link{color:var(--accent-2);font-weight:600;cursor:pointer;}
 
  .range-tabs{display:flex;gap:6px;margin-top:14px;}
  .range-tabs button{
    flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--border-soft);background:transparent;
    color:var(--text-faint);font-size:12px;font-weight:650;
  }
  .range-tabs button.active{background:var(--surface-3);color:var(--text);border-color:var(--border);}
  canvas.chart{width:100%;height:150px;display:block;margin-top:12px;}
  .savings-compare-block{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);}
  .savings-compare-block .label{font-size:12px;color:var(--text-dim);}
  .savings-compare-block .val{font-size:12.5px;font-weight:650;}
 
  /* Buckets */
  .bucket-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
  .bucket-chip{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 10px;}
  .bucket-chip .bname{font-size:11px;color:var(--text-dim);font-weight:650;margin-bottom:6px;}
  .bucket-chip .bval{font-family:var(--font-num);font-size:15px;font-weight:700;}
  .bucket-chip .bdelta{font-size:11.5px;font-weight:650;margin-top:2px;}
  .dot-long{color:var(--accent-2);} .dot-div{color:var(--green);} .dot-spec{color:var(--amber);}
 
  /* How we're doing */
  .summary-text{font-size:13.5px;line-height:1.55;color:var(--text-dim);margin:0 0 14px;}
  .outlook-opt{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 12px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);margin-bottom:8px;
  }
  .outlook-opt .otext{font-size:13px;font-weight:550;}
  .outlook-opt button{
    background:var(--accent-soft);color:var(--accent-2);border:none;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:650;
  }
 
  /* Banner */
  .banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--amber-soft);border:1px solid rgba(224,163,54,.3);border-radius:var(--radius-md);
    padding:12px 14px;margin-bottom:14px;
  }
  .banner .btext{font-size:13px;font-weight:600;color:#f0c874;}
  .banner button{background:var(--amber);color:#1a1305;border:none;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;white-space:nowrap;}
 
  /* Buttons */
  .btn{border-radius:12px;padding:12px 16px;font-size:14px;font-weight:650;border:1px solid var(--border);background:var(--surface-2);color:var(--text);width:100%;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn-primary:disabled{opacity:.4;}
  .btn-ghost{background:transparent;}
  .btn-danger{background:var(--red-soft);border-color:rgba(240,85,74,.3);color:var(--red);}
  .btn-row{display:flex;gap:10px;}
 
  /* Bottom nav */
  .nav-bottom{
    position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;
    background:rgba(10,10,15,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);
    display:flex;padding:9px 6px calc(env(safe-area-inset-bottom,0) + 8px);z-index:40;
  }
  .nav-bottom button{
    flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--text-dim);font-size:10.5px;font-weight:700;padding:7px 4px;margin:0 3px;border-radius:12px;
    transition:background .15s,color .15s;
  }
  .nav-bottom button .ic{font-size:20px;}
  .nav-bottom button.active{color:var(--accent-2);background:var(--accent-soft);}
  @media (min-width:900px){
    .nav-bottom{position:sticky;top:0;max-width:none;flex-direction:column;height:100vh;border-top:none;border-right:1px solid var(--border);padding:22px 12px;background:var(--bg);}
    .nav-bottom button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 12px;font-size:13.5px;margin:0 0 4px;}
  }
 
  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:650;color:var(--text-dim);margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field input[type=password],
  .field select, .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:11px 12px;color:var(--text);font-size:14px;
  }
  .field textarea{min-height:70px;resize:vertical;}
  .field .hint{font-size:11.5px;color:var(--text-faint);margin-top:5px;}
  /* Standalone .hint (outside a .field) needs its own rule too — without this,
     every hint-classed paragraph not nested in a form field falls through to
     plain default text (larger, brighter) instead of the small dim caption
     style it was meant to have. */
  .hint{font-size:11.5px;color:var(--text-faint);}
  /* Substantive explanatory paragraphs — same treatment everywhere, distinct from
     the small .hint captions used for field-level notes and transient status text. */
  .explainer{font-size:13.5px;line-height:1.6;color:var(--text-dim);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
 
  /* Stepper */
  .stepper-head{display:flex;gap:6px;margin-bottom:16px;}
  .stepper-head .seg{flex:1;height:4px;border-radius:2px;background:var(--surface-3);}
  .stepper-head .seg.done{background:var(--accent);}
 
  /* Positions table */
  .pos-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .pos-row:last-child{border-bottom:none;}
  .pos-left{display:flex;align-items:center;gap:11px;}
  .pos-badge{width:36px;height:36px;border-radius:10px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:750;color:var(--text-dim);}
  .pos-name{font-size:13.5px;font-weight:650;}
  .pos-sub{font-size:11.5px;color:var(--text-faint);margin-top:1px;}
  .pos-right{text-align:right;}
  .pos-val{font-family:var(--font-num);font-size:13.5px;font-weight:650;}
  .pos-delta{font-size:11.5px;font-weight:650;margin-top:1px;}
 
  .tabs2{display:flex;gap:6px;margin-bottom:14px;}
  .tabs2 button{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:12.5px;font-weight:650;}
  .tabs2 button.active{background:var(--accent-soft);color:var(--accent-2);border-color:rgba(59,130,246,.35);}
 
  .taxline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-soft);font-size:13px;}
  .taxline:last-child{border-bottom:none;}
  .flag{font-size:10.5px;background:var(--amber-soft);color:var(--amber);padding:2px 7px;border-radius:6px;font-weight:650;margin-left:6px;}
 
  .exempt-ring-wrap{display:flex;align-items:center;gap:16px;margin:6px 0 10px;}
  .exempt-figs .big{font-size:20px;font-weight:750;font-family:var(--font-num);}
  .exempt-figs .small{font-size:12px;color:var(--text-dim);margin-top:2px;}
 
  /* Learn */
  .learn-cat{margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;}
  .learn-cat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;cursor:pointer;background:var(--surface);}
  .learn-cat h3{font-size:13.5px;color:var(--text);font-weight:700;}
  .learn-cat-arrow{color:var(--text-faint);font-size:16px;transition:transform .15s;}
  .learn-cat-arrow.open{transform:rotate(90deg);color:var(--accent-2);}
  [data-learnbody]{padding:0 12px 12px;}
  details.entry{border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;background:var(--surface-2);}
  details.entry summary{font-size:13.5px;font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  details.entry summary::-webkit-details-marker{display:none;}
  details.entry summary:after{content:'+';color:var(--text-faint);font-size:16px;font-weight:400;}
  details.entry[open] summary:after{content:'–';}
  details.entry p{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin:10px 0 0;}
 
  /* PIN screen */
  .pin-screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:20px;}
  .pin-dots{display:flex;gap:14px;}
  .pin-dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--text-faint);display:block;}
  .pin-dots i.filled{background:var(--accent);border-color:var(--accent);}
  .pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
  .pin-pad button{width:64px;height:64px;border-radius:50%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:650;}
  .pin-pad button:active{background:var(--surface-3);}
  .pin-title{font-size:16px;font-weight:700;}
  .pin-sub{font-size:12.5px;color:var(--text-faint);margin-top:-10px;}
 
  .center-col{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .setup-scroll{padding:20px 20px 40px;}
 
  .chip-select{display:flex;flex-wrap:wrap;gap:8px;}
  .chip-select button{padding:8px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:12.5px;font-weight:650;}
  .chip-select button.active{background:var(--accent-soft);color:var(--accent-2);border-color:rgba(59,130,246,.4);}
 
  h1,h2,h3{margin:0;}
  .page-title{font-size:20px;font-weight:750;letter-spacing:-0.01em;margin:6px 0 16px;}
  .back-row{display:flex;align-items:center;gap:10px;margin:14px 0 4px;}
  .back-row button{background:none;border:none;color:var(--text-dim);font-size:14px;font-weight:650;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--text-faint);font-size:13px;}
 
  /* History / asset evolution timeline */
  .evo-item{position:relative;padding-left:16px;padding-bottom:16px;border-left:2px solid var(--border-soft);margin-left:4px;}
  .evo-item:last-child{padding-bottom:2px;}
  .evo-item::before{content:'';position:absolute;left:-6px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .evo-item.is-sell::before{background:var(--red);}
  .evo-item.is-dividend::before{background:var(--green);}
  .evo-date{font-size:11.5px;color:var(--text-faint);}
  .evo-line{display:flex;justify-content:space-between;align-items:baseline;margin-top:2px;}
  .evo-running{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .evo-reason{font-size:12px;color:var(--text-dim);margin-top:3px;}
 
  /* Dual-handle range slider for the export period picker */
  .dual-range{position:relative;height:36px;margin:8px 0 4px;}
  .dual-range .track-bg{position:absolute;top:16px;left:0;right:0;height:4px;background:var(--surface-3);border-radius:2px;}
  .dual-range .track-fill{position:absolute;top:16px;height:4px;background:var(--accent);border-radius:2px;}
  .dual-range input[type=range]{position:absolute;width:100%;top:8px;margin:0;background:transparent;-webkit-appearance:none;pointer-events:none;}
  .dual-range input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none;background:transparent;}
  .dual-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer;margin-top:0;}
  .dual-range input[type=range]::-moz-range-track{background:transparent;}
  .dual-range input[type=range]::-moz-range-thumb{pointer-events:auto;width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--accent);cursor:pointer;}
  .range-preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .range-preset-row button{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:11.5px;font-weight:650;}
  .range-preset-row button.active{background:var(--accent-soft);color:var(--accent-2);border-color:rgba(59,130,246,.4);}
  .action-pill{border:1px solid var(--border);background:var(--surface-3);color:var(--text-dim);border-radius:8px;padding:6px 10px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
  .action-pill:active{background:var(--surface-2);}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="app"></div>
 
<script>
/* =========================================================================
   LEDGER — family investment practice tracker
   Single-file vanilla JS app. State persists to localStorage.
   ========================================================================= */
 
const AI_MODEL = 'claude-sonnet-4-6';
const ASSET_TYPES = ['ETF','Stock','Bond','Metal','Crypto'];
const BUCKETS = [
  {id:'long', name:'Long-term', short:'Long-term', color:'dot-long', desc:'Lower-risk, broad diversification — built for compounding over your full horizon.'},
  {id:'div',  name:'Balanced',  short:'Balanced',  color:'dot-div',  desc:'A middle ground — steadier picks like dividend payers, still with real risk attached.'},
  {id:'spec', name:'Speculative', short:'Speculative', color:'dot-spec', desc:'Higher-risk, higher-volatility picks. Smallest slice, biggest swings.'},
];
 
// Tone profiles — a per-account style setting (not an age field) that shapes
// how the "Read this" summary on Home talks to this account.
// Reassurance is about the environment being safe to learn in; it never
// means agreeing with a shaky plan just to be nice, in any of these.
const TONE_PROFILES = {
  direct: {
    label: 'Direct',
    instruction: "Talk like a sharp, straight-talking older friend — casual, confident, no fluff, comfortable with informal language ('yeah', 'honestly', 'here's the thing', a bit of bro energy) but never dumbed down. Treat him as someone who can handle real analysis and real pushback on a bad idea."
  },
  encouraging: {
    label: 'Encouraging',
    instruction: "Lead with warmth — this is a safe space to learn, mistakes are expected and are how you actually get better at this, and she has every right to be here making these calls herself. Be affirming and upbeat, like a coach who's genuinely glad she's in the game. At the same time, stay straightforward and honest about risk and trade-offs — the reassurance is about the environment being safe, never about agreeing with a shaky plan just to be nice."
  },
  neutral: {
    label: 'Neutral',
    instruction: 'Speak in a clear, approachable, straightforward tone — friendly but not overly casual, no forced slang.'
  }
};
 
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtEUR = (n) => (n<0?'-':'') + '€' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtPct = (n) => (n>0?'+':'') + n.toFixed(1) + '%';
 
/* ---------------------------- State ---------------------------- */
function loadState(){
  try{
    const raw = localStorage.getItem('ledgerState');
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return null;
}
function saveState(){
  try{
    localStorage.setItem('ledgerState', JSON.stringify(S));
  }catch(e){
    console.error('Save failed', e);
    alert("Couldn't save that change — your browser's storage may be full or restricted (e.g. private browsing mode). The change may not persist after closing the app.");
  }
}
 
let S = loadState() || {
  appPinSet:false, appPin:null,
  unlocked:false,
  profiles:[],

  draftProfile:null,

};

/* ---------------------------- Domain math ---------------------------- */
function bucketAmount(plan, bucketId){ return plan.buckets[bucketId] || 0; }
 
function assetsFor(profile, bucketId){ return profile.assets.filter(a=>a.bucket===bucketId); }
 
// Amount is the order value (what actually buys units); the fee is a separate
// real cost on top, so it adds to cost basis rather than reducing units bought.
function unitsFor(tx){ return tx.priceAtBuy>0 ? tx.amountEUR/tx.priceAtBuy : 0; }
 
function currentPrice(profile, assetId){
  const p = profile.prices[assetId];
  if(p) return p.price;
  const tx = profile.transactions.filter(t=>t.assetId===assetId).slice(-1)[0];
  return tx ? (tx.priceAtBuy||tx.priceAtSell) : 0;
}
 
// Positions are built by replaying each asset's transactions in date order.
// Buys add units and cost basis. Sells remove units and reduce cost basis using
// the average-cost method (average cost per unit at the moment of the sale),
// and record the realized gain/loss on that sale.
function positionsFor(profile){
  const map = {};
  const sorted = profile.transactions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  sorted.forEach(tx=>{
    if(!map[tx.assetId]) map[tx.assetId] = {assetId:tx.assetId, costBasis:0, units:0, feesPaid:0, realizedGain:0, grossCostBasisEver:0, dividendsReceived:0, txs:[]};
    const pos = map[tx.assetId];
    pos.txs.push(tx);
    pos.feesPaid += (tx.fee||0);
    if(tx.type==='sell'){
      const avgCost = pos.units>0 ? pos.costBasis/pos.units : 0;
      const soldUnits = Math.min(tx.units||0, pos.units);
      const costRemoved = avgCost*soldUnits;
      const proceeds = soldUnits*(tx.priceAtSell||0) - (tx.fee||0);
      const realizedGain = proceeds - costRemoved;
      tx._costRemoved = costRemoved; tx._realizedGain = realizedGain; tx._proceeds = proceeds;
      pos.units -= soldUnits;
      pos.costBasis -= costRemoved;
      pos.realizedGain += realizedGain;
    } else if(tx.type==='dividend'){
      pos.dividendsReceived += tx.amountEUR;
    } else {
      pos.costBasis += tx.amountEUR + (tx.fee||0);
      pos.units += unitsFor(tx);
      pos.grossCostBasisEver += tx.amountEUR + (tx.fee||0); // never reduced by later sells
    }
  });
  return Object.values(map).map(pos=>{
    const asset = profile.assets.find(a=>a.id===pos.assetId);
    const price = currentPrice(profile, pos.assetId);
    const value = Math.max(pos.units,0) * price;
    const gain = value - pos.costBasis; // unrealized only, on what's still held
    const gainPct = pos.costBasis>0 ? (gain/pos.costBasis*100) : 0;
    // Total return: unrealized gain on what's left + profit already locked in via
    // sells + any dividends received — the fuller picture of how this pick has
    // actually done, not just what's still on paper.
    const totalReturn = gain + pos.realizedGain + pos.dividendsReceived;
    return {...pos, units:Math.max(pos.units,0), costBasis:Math.max(pos.costBasis,0), asset, price, value, gain, gainPct, totalReturn};
  });
}
 
function bucketTotals(profile){
  const out = {};
  BUCKETS.forEach(b=>out[b.id] = {costBasis:0, value:0});
  positionsFor(profile).forEach(pos=>{
    if(!pos.asset) return;
    out[pos.asset.bucket].costBasis += pos.costBasis;
    out[pos.asset.bucket].value += pos.value;
  });
  return out;
}
 
function portfolioTotals(profile){
  const positions = positionsFor(profile);
  const costBasis = positions.reduce((s,p)=>s+p.costBasis,0);
  const value = positions.reduce((s,p)=>s+p.value,0);
  const feesPaid = positions.reduce((s,p)=>s+p.feesPaid,0);
  const realizedGain = positions.reduce((s,p)=>s+p.realizedGain,0);
  const dividendsReceived = positions.reduce((s,p)=>s+p.dividendsReceived,0);
  const grossCostBasisEver = positions.reduce((s,p)=>s+p.grossCostBasisEver,0);
  const unrealizedGain = value-costBasis;
  // "gain"/"gainPct" here mean the true all-time return — unrealized gain on what's
  // still held, PLUS profit already locked in from selling, PLUS dividends received.
  // Using gross cost basis ever contributed (not just what's currently invested) as
  // the denominator, since money that was sold off shouldn't drop out of the base
  // just because it's no longer sitting in a position.
  const gain = unrealizedGain + realizedGain + dividendsReceived;
  const gainPct = grossCostBasisEver>0 ? (gain/grossCostBasisEver*100) : 0;
  return {costBasis, value, feesPaid, realizedGain, dividendsReceived, grossCostBasisEver, unrealizedGain, gain, gainPct};
}
 
// The "invested so far" figure (Home, and the vs-savings comparison) is meant to
// be the raw cash directed at buying assets — a clean principal figure comparable
// to what would've gone into a savings account instead. Fees are a real cost for
// gain/loss and tax purposes (see positionsFor/portfolioTotals' fee-inclusive cost
// basis), but they're a friction specific to investing that a savings account
// wouldn't have, so they're deliberately excluded here.
function principalContributed(profile){
  return profile.transactions
    .filter(tx=>tx.type!=='sell' && tx.type!=='dividend')
    .reduce((s,tx)=>s+tx.amountEUR, 0);
}
 
function savingsComparisonValue(profile){
  // Monthly contributions compounding at profile.plan.savingsRate (annual %), monthly compounding.
  // Counted per month you actually contributed — not calendar time elapsed — so the comparison
  // shows up as soon as a purchase is logged, rather than waiting for a full month to pass.
  // Floored at 1: the plan itself represents a first committed deposit, so this is never zero
  // even before the first purchase is actually logged.
  const plan = profile.plan;
  if(!plan) return 0;
  const monthlyRate = (plan.savingsRate/100)/12;
  const months = Math.max(contributionMonthsCount(profile), 1);
  let fv = 0;
  for(let i=0;i<months;i++){
    fv = (fv + plan.monthlyAmount) * (1+monthlyRate);
  }
  return fv;
}
 
function contributionMonthsCount(profile){
  const seen = new Set();
  profile.transactions.forEach(tx=>{
    const d = new Date(tx.date);
    seen.add(d.getFullYear()+'-'+d.getMonth());
  });
  return seen.size;
}
 
function monthsSince(isoDate){
  const start = new Date(isoDate);
  const now = new Date();
  let months = (now.getFullYear()-start.getFullYear())*12 + (now.getMonth()-start.getMonth());
  if(now.getDate() < start.getDate()) months -= 1;
  return Math.max(0, months);
}
 
function goalProgress(plan){
  const start = new Date(plan.startDate);
  const end = new Date(start); end.setFullYear(end.getFullYear()+plan.horizonYears);
  const now = new Date();
  const totalMs = end-start;
  const elapsedMs = Math.min(Math.max(now-start,0), totalMs);
  const pct = totalMs>0 ? (elapsedMs/totalMs*100) : 0;
  const remainMs = Math.max(end-now,0);
  const remainDays = Math.floor(remainMs/86400000);
  const years = Math.floor(remainDays/365);
  const months = Math.floor((remainDays%365)/30);
  return {pct, years, months, startDate:start, endDate:end};
}
 
function shortMonthYear(d){ return d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); }
 
function isContributionDueThisMonth(profile){
  const plan = profile.plan;
  if(!plan) return false;
  const now = new Date();
  const thisMonthKey = now.getFullYear()+'-'+now.getMonth();
  // Only actual purchases count toward "the contribution was made" — a sell or a
  // dividend landing in the current month shouldn't wrongly satisfy this.
  const buys = profile.transactions.filter(tx=>tx.type!=='sell' && tx.type!=='dividend');
  const lastBuy = buys.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-1)[0];
  if(!lastBuy) return true;
  const lastDate = new Date(lastBuy.date);
  const lastKey = lastDate.getFullYear()+'-'+lastDate.getMonth();
  return lastKey !== thisMonthKey;
}
 
/* ---------------------------- Tax (Belgium, 2026 regime) ---------------------------- */
const TAX_RATE = 0.10;
const REYNDERS_RATE = 0.30;
const DEFAULT_EXEMPTION = 10000;
 
// Shared tax split: how much of a gain is taxable outright vs. subject to the
// Reynders tax (bond-fund interest portion, taxed separately at 30%).
function assetTaxOnGain(asset, gain){
  if(!asset || gain<=0) return {taxableGain:Math.max(gain||0,0), reyndersPortion:0, reyndersTax:0, note:null};
  if(asset.type==='Bond' && asset.reyndersPct>0){
    const reyndersPortion = gain * (asset.reyndersPct/100);
    const residual = gain - reyndersPortion;
    return {
      taxableGain: residual,
      reyndersPortion,
      reyndersTax: reyndersPortion*REYNDERS_RATE,
      note: `Reynders tax applies to ~${asset.reyndersPct}% (interest-bearing portion)`
    };
  }
  return {taxableGain:gain, reyndersPortion:0, reyndersTax:0, note:null};
}
 
function assetTax(profile, pos){
  return assetTaxOnGain(pos.asset, pos.gain);
}
 
// Sums realized gain/loss from sells of one asset within a single calendar year —
// Belgium's exemption resets every year, so lumping every sell ever made together
// against one €10,000 allowance would be wrong from year two onward.
function realizedGainInYear(profile, assetId, year){
  return computeAssetEvolution(profile, assetId)
    .filter(ev=>ev.tx.type==='sell' && new Date(ev.tx.date).getFullYear()===year)
    .reduce((s,ev)=>s+ev.realizedGain, 0);
}
 
// Same split as assetTax, applied to a position's REALIZED gain within a given
// calendar year (from completed sells) rather than its unrealized (mark-to-market)
// gain — this is the figure that's actually taxable, scoped to the right tax year.
function assetTaxRealized(profile, pos, year){
  const yearGain = realizedGainInYear(profile, pos.assetId, year ?? new Date().getFullYear());
  return assetTaxOnGain(pos.asset, yearGain);
}
 
function householdTaxSummary(includeHidden){
  const year = new Date().getFullYear();
  const profiles = includeHidden ? S.profiles : S.profiles.filter(pr=>!pr.hidden);
  let realizedGain = 0, realizedReynders = 0;
  let unrealizedGain = 0, unrealizedReynders = 0;
  profiles.forEach(profile=>{
    positionsFor(profile).forEach(pos=>{
      if(!pos.asset) return;
      if(pos.gain>0){
        const t = assetTax(profile,pos);
        unrealizedGain += Math.max(t.taxableGain,0);
        unrealizedReynders += t.reyndersTax;
      }
      const rt = assetTaxRealized(profile,pos,year);
      if(rt.taxableGain>0 || rt.reyndersTax>0){
        realizedGain += Math.max(rt.taxableGain,0);
        realizedReynders += rt.reyndersTax;
      }
    });
  });
  const exemption = S.exemptionAmount || DEFAULT_EXEMPTION;
  const taxableAboveExemption = Math.max(realizedGain - exemption, 0);
  const estTax = taxableAboveExemption*TAX_RATE + realizedReynders;
  return {
    year, realizedGain, realizedReynders, exemption, taxableAboveExemption, estTax,
    unrealizedGain, unrealizedReynders,
    // kept for anything still reading the old shape
    totalGain: realizedGain, reyndersTotal: realizedReynders
  };
}

    </div>`;
  document.getElementById('pname').oninput = (e)=>{ d.name=e.target.value; document.getElementById('next-btn').disabled=!d.name; };

function renderPlanSetup(){

  const sum = d.buckets.long + d.buckets.div + d.buckets.spec;
  const valid = d.goalName && sum===d.monthlyAmount;
  app.innerHTML = `

        </div>

      </div>
      <div class="field">
        <label>Default broker fee (%)</label>
        <input type="number" id="gfee" value="${d.defaultFeePct}" step="0.05" />
        <div class="hint">Pre-fills the fee on each contribution — varies by broker and instrument, so double-check against your actual account. Editable per contribution.</div>
      </div>
      <button class="btn btn-primary" id="finish-btn" ${valid?'':'disabled'}>Create plan</button>
    </div>`;
 
  function refresh(){
    const sum2 = d.buckets.long + d.buckets.div + d.buckets.spec;
    document.getElementById('sumhint').textContent = `Sum: €${sum2} of €${d.monthlyAmount}`;
    document.getElementById('sumhint').style.color = sum2===d.monthlyAmount ? 'var(--text-faint)' : 'var(--red)';
    document.getElementById('finish-btn').disabled = !(d.goalName && sum2===d.monthlyAmount);
  }
  document.getElementById('gname').oninput = e=>{ d.goalName=e.target.value; refresh(); };
  document.getElementById('ghoriz').oninput = e=>{ d.horizonYears=+e.target.value; };
  document.getElementById('gstart').oninput = e=>{ d.startDate=e.target.value; };
  document.getElementById('gmonthly').oninput = e=>{ d.monthlyAmount=+e.target.value; refresh(); };
  document.getElementById('blong').oninput = e=>{ d.buckets.long=+e.target.value; refresh(); };
  document.getElementById('bdiv').oninput = e=>{ d.buckets.div=+e.target.value; refresh(); };
  document.getElementById('bspec').oninput = e=>{ d.buckets.spec=+e.target.value; refresh(); };
  document.getElementById('gsavings').oninput = e=>{ d.savingsRate=+e.target.value; };
  document.getElementById('gfee').oninput = e=>{ d.defaultFeePct=+e.target.value; };
 
  document.getElementById('finish-btn').onclick = ()=>{
    const id = uid();
    S.profiles.push({
      id, name:S.draftProfile.name, pin:S.draftProfile.pin||null, tone:S.draftProfile.tone||'neutral',
      hidden: S.draftProfile.hidden||false,
      plan:{...d}, assets:[], transactions:[], prices:{}
    });
    S.activeProfileId = id;
    S.draftProfile=null; S.draftPlan=null; S.setupStage=null;
    if(S.profiles.length===1 && !S.appPinSet){
      // offer app-level pin later via settings; skip forcing now
    }
    saveState();
    render();
  };
}
 
/* ---- Shell + nav ---- */
function renderShell(){

    <div>

function renderNav(){
  const fam = isFamilyView();
  const items = [
    {id:'home', ic:'⌂', label:'Home'},
    {id:'positions', ic:'▤', label:'Activity'},
    {id:'learn', ic:'◎', label:'Learn'},
    {id:'tax', ic:'§', label:'Tax'},
  ];
  const nav = document.getElementById('nav');
  nav.innerHTML = items.map(it=>`

      <span class="ic">${it.ic}</span><span>${it.label}</span>
    </button>`).join('');
  nav.querySelectorAll('[data-nav]').forEach((b,i)=>{
    b.onclick = ()=>{

      S.view=b.dataset.nav; render();

function renderTopbar(){
  const p = activeProfile();
  const fam = isFamilyView();
  const plusMode = S.activeProfileId==='FAMILY_PLUS';
  const initials = fam ? '👪' : p.name.slice(0,2).toUpperCase();
  const label = plusMode ? 'Family+' : (fam ? 'Family' : p.name);
  const bar = document.getElementById('topbar');
  bar.innerHTML = `
    <div class="brand" id="brand-logo" style="cursor:pointer;user-select:none;"><span class="mark"><i style="height:40%"></i><i style="height:70%"></i><i style="height:55%"></i></span>DIY Fund</div>
    <div class="topbar-actions">
      <div class="profile-switch" id="profile-switch"><span class="avatar">${initials}</span>${label} ▾</div>
      <button class="icon-btn" id="settings-btn">⚙</button>
    </div>`;
  document.getElementById('profile-switch').onclick = ()=>{ S.view='switch'; render(); };
  document.getElementById('settings-btn').onclick = ()=>{ S.view='settings'; render(); };
 
  // Long-press the logo to reach the admin unlock — deliberately not a visible
  // button, since the whole point is that it isn't discoverable by browsing.
  const logo = document.getElementById('brand-logo');
  let pressTimer = null;
  const startPress = ()=>{
    pressTimer = setTimeout(()=>{
      S.pinEntry='';
      S.view = S.adminPin ? 'admin-pin-entry' : 'admin-pin-setup';
      render();
    }, 700);
  };
  const cancelPress = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer=null; } };
  logo.addEventListener('mousedown', startPress);
  logo.addEventListener('touchstart', startPress, {passive:true});
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(evt=>logo.addEventListener(evt, cancelPress));
}
 
function renderView(){
  const main = document.getElementById('main');
  const p = activeProfile();
  const profileRequired = ['contribute','sell','dividend','register-choice','edit-tx'];
  if(!p && profileRequired.includes(S.view)){ S.view='home'; }
  if(S.view==='switch') return renderSwitchProfile(main);
  if(S.view==='settings') return renderSettings(main, p);
  if(S.view==='contribute') return renderContributeFlow(main, p);
  if(S.view==='sell') return renderSellFlow(main, p);
  if(S.view==='dividend') return renderDividendFlow(main, p);
  if(S.view==='register-choice') return renderRegisterChoice(main, p);
  if(S.view==='edit-tx') return renderEditTransaction(main, p);
  if(S.view==='home') return p ? renderHome(main, p) : renderFamilyHome(main);
  if(S.view==='positions') return p ? renderPositions(main, p) : renderFamilyPositions(main);
  if(S.view==='export') return renderExport(main);
  if(S.view==='learn') return renderLearn(main);
  if(S.view==='tax') return renderTax(main, p);
}

          <div class="row" style="gap:11px;">
            <span class="avatar" style="width:34px;height:34px;border-radius:10px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;">👪</span>

// Colors for the diversification chart: hue anchored to the bucket (matching the
// bucket dot colors elsewhere), lightness varied per asset within that bucket so
// each slice is distinguishable without introducing a whole new palette.
function assetSliceColor(bucketId, idx){
  const hues = {long:217, div:142, spec:38};
  const hue = hues[bucketId]||217;
  const light = Math.max(28, 60 - idx*9);
  return `hsl(${hue}, 68%, ${light}%)`;
}
 
function buildAssetSlices(positions){
  const counters = {long:0, div:0, spec:0};
  return positions
    .filter(pos=>pos.asset && pos.value>0.0001)
    .map(pos=>{
      const idx = counters[pos.asset.bucket]++;
      return {label:pos.asset.ticker, value:pos.value, color:assetSliceColor(pos.asset.bucket, idx)};
    })
    .sort((a,b)=>b.value-a.value);
}
 
function diversifyLegendHTML(slices){
  const total = slices.reduce((s,sl)=>s+sl.value,0);
  return slices.map(sl=>`
    <div class="row" style="font-size:12px;">
      <span style="display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
        <span style="width:9px;height:9px;border-radius:3px;background:${sl.color};display:inline-block;flex-shrink:0;"></span>${sl.label}
      </span>
      <span class="num" style="color:var(--text-dim);flex-shrink:0;">${total>0?(sl.value/total*100).toFixed(0):0}%</span>
    </div>`).join('');
}
 
// Generic donut chart renderer — used for both the per-account and family-wide
// diversification views.
function drawDonutChart(canvas, slices){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const size = canvas.clientWidth||110;
  canvas.width = size*dpr; canvas.height = size*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,size,size);
  const total = slices.reduce((s,sl)=>s+sl.value,0);
  const cx=size/2, cy=size/2, r=size/2-2;
  if(total<=0){
    ctx.strokeStyle='rgba(146,153,172,.25)'; ctx.lineWidth=size*0.16;
    ctx.beginPath(); ctx.arc(cx,cy,r-ctx.lineWidth/2,0,Math.PI*2); ctx.stroke();
    return;
  }
  let start=-Math.PI/2;
  slices.forEach(sl=>{
    const angle = (sl.value/total)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.closePath();
    ctx.fillStyle=sl.color;
    ctx.fill();
    start+=angle;
  });
  ctx.beginPath();
  ctx.arc(cx,cy,r*0.56,0,Math.PI*2);
  ctx.fillStyle = '#12141c';
  ctx.fill();
}

function monthName(){ return new Date().toLocaleString('en-US',{month:'long'}); }
 
function projectOnPace(p){
  const calendarMonthsElapsed = monthsSince(p.plan.startDate);
  const historyMonths = contributionMonthsCount(p); // months you've actually had money invested
  const totalMonths = p.plan.horizonYears*12;
  const totals = portfolioTotals(p);
  const remainingMonths = Math.max(totalMonths-calendarMonthsElapsed,0);
 
  // With no contributions logged yet, there's nothing to derive a rate from —
  // project on contributions alone. Uses gross cost basis ever contributed (not
  // just what's currently invested), so a full sell-out doesn't wrongly look like
  // "no history" if there's real realized performance on record.
  if(totals.grossCostBasisEver<=0){
    return totals.value + remainingMonths*p.plan.monthlyAmount;
  }
 
  // Derive an implied monthly rate from true all-time performance so far —
  // unrealized gain on what's still held, plus anything already locked in via
  // sells or dividends — over the months you've actually been invested, not
  // calendar time since the plan started. Clamped to a sane range so a short
  // lucky (or unlucky) stretch doesn't extrapolate into an absurd forecast, and
  // floored above zero so a near-total loss can't send Math.pow into NaN territory.
  const growthMultiplier = Math.max(1 + totals.gainPct/100, 0.01);
  let r = Math.pow(growthMultiplier, 1/Math.max(historyMonths,1)) - 1;
  r = Math.max(Math.min(r, 0.02), -0.02);
 
  // Standard future-value formula: today's holdings compounding forward, plus a
  // stream of future monthly contributions each compounding for its own
  // remaining time (not all treated as if they'd had the full period to grow).
  const fvLumpSum = totals.value * Math.pow(1+r, remainingMonths);
  const fvContributions = r!==0
    ? p.plan.monthlyAmount * ((Math.pow(1+r,remainingMonths)-1)/r)
    : p.plan.monthlyAmount * remainingMonths;
  return fvLumpSum + fvContributions;
}
 
// The savings-only counterpart to projectOnPace: what the same €X/month would be
// worth by the end of the full horizon if it had all gone into a savings account
// instead — the forward-looking twin of savingsComparisonValue (which only looks
// at what's happened so far).
function projectSavingsPace(p){
  const totalMonths = p.plan.horizonYears*12;
  const monthlyRate = (p.plan.savingsRate/100)/12;
  let fv = 0;
  for(let i=0;i<totalMonths;i++){
    fv = (fv + p.plan.monthlyAmount) * (1+monthlyRate);
  }
  return fv;
}
 
function lastPriceMeta(p){

// Checks whether the speculative bucket has drifted meaningfully above its
// original target share — a sign the portfolio has gotten riskier than intended,
// usually because strong (or weak) performance skewed the balance over time.
function diversificationWarning(p, bTotals, totalValue){
  if(totalValue<=0 || !p.plan.buckets.spec) return null;
  const targetPct = p.plan.buckets.spec / p.plan.monthlyAmount * 100;
  const currentPct = bTotals.spec.value/totalValue*100;
  if(currentPct - targetPct >= 15){
    return `Worth flagging: speculative now makes up ${currentPct.toFixed(0)}% of your total, well above your original ${targetPct.toFixed(0)}% target. Since that's the highest-risk bucket, it might be worth rebalancing some of those gains into steadier ground.`;
  }
  return null;
}
 
function buildSummaryText(p, totals, ahead){
  const bTotals = bucketTotals(p);
  let best=null, worst=null;
  BUCKETS.forEach(b=>{
    const bt=bTotals[b.id]; if(bt.costBasis<=0) return;
    const pct=(bt.value-bt.costBasis)/bt.costBasis*100;
    if(!best||pct>best.pct) best={name:b.short,pct};
    if(!worst||pct<worst.pct) worst={name:b.short,pct};
  });
  if(!best) return `No contributions logged yet — once you log the first one, this'll track how you're doing against a savings account and how each bucket is pulling its weight.`;
 
  const principal = principalContributed(p);
  let text;
  if(ahead>=0){
    text = `You've put in ${fmtEUR(principal)} so far, and right now you're ahead of a plain savings account by ${fmtEUR(Math.abs(ahead))}. Nice work — that's the real reward for taking on the extra risk.`;
    if(best && worst && best.name!==worst.name){
      text += ` ${best.name} is carrying the growth this stretch (${fmtPct(best.pct)}), while ${worst.name} is ${worst.pct<0?'pulling back':'lagging'} (${fmtPct(worst.pct)}).`;
    }
  } else {
    text = `You've put in ${fmtEUR(principal)} so far, and right now you're behind a plain savings account by ${fmtEUR(Math.abs(ahead))}. That happens — investing carries real risk, and a rough stretch like this doesn't need to change the plan.`;
    if(best && worst && best.name!==worst.name){
      text += ` ${worst.name} is what's dragging things down at the moment (${fmtPct(worst.pct)}), while ${best.name} is holding up better (${fmtPct(best.pct)}).`;
    }
    text += ` Worth a calm look at whether your bucket split still feels right, rather than reacting to one stretch.`;
  }
 
  const warning = diversificationWarning(p, bTotals, totals.value);
  if(warning) text += ` ${warning}`;
 
  if(ahead<0 && (p.tone||'neutral')==='encouraging'){
    text += ` Remember — savings are really just one part of a bigger picture here. The whole point of spreading across buckets is that no single comparison tells the full story; the mix is what's actually protecting you long-term.`;
  }
  return text;
}
 
/* ---- Chart ---- */
// Replays a set of transactions (possibly spanning multiple assets, even multiple
// profiles for the Family view) chronologically, tracking each asset's own running
// cost basis so sells correctly reduce the cumulative total by the cost removed —
// rather than naively summing amountEUR, which sell transactions don't carry.
function buildCumulativeCostBasisPoints(transactions){
  const perAsset = {};
  const sorted = transactions.slice().sort((a,b)=>a.date.localeCompare(b.date));
  const points = [];
  let runningTotal = 0;
  sorted.forEach(tx=>{
    if(!perAsset[tx.assetId]) perAsset[tx.assetId] = {units:0, costBasis:0};
    const st = perAsset[tx.assetId];
    if(tx.type==='sell'){
      const avgCost = st.units>0 ? st.costBasis/st.units : 0;
      const soldUnits = Math.min(tx.units||0, st.units);
      const costRemoved = avgCost*soldUnits;
      st.units -= soldUnits; st.costBasis -= costRemoved;
      runningTotal -= costRemoved;
    } else {
      const cost = tx.amountEUR + (tx.fee||0);
      st.costBasis += cost;
      st.units += unitsFor(tx);
      runningTotal += cost;
    }
    points.push({date:tx.date, val:runningTotal});
  });
  return points;
}
 
function drawChart(canvas, p, savingsVal){
  if(!canvas) return;
  if(!p.transactions.length){
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio||1;
    const w = canvas.clientWidth, hgt = 150;
    canvas.width = w*dpr; canvas.height = hgt*dpr;
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,hgt);
    ctx.fillStyle = 'rgba(146,153,172,.5)';
    ctx.font = '12px Inter'; ctx.fillText('Log your first contribution to start the chart', 8, hgt/2);
    return;
  }
  const points = buildCumulativeCostBasisPoints(p.transactions);
  const totals = portfolioTotals(p);
  drawChartCore(canvas, points, totals.value, savingsVal);
}
 
function drawFamilyChart(canvas, savingsVal, includeHidden){
  if(!canvas) return;
  const profiles = includeHidden ? S.profiles : S.profiles.filter(pr=>!pr.hidden);
  const allTx = [];
  profiles.forEach(profile=>profile.transactions.forEach(tx=>allTx.push(tx)));
  if(!allTx.length){
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio||1;
    const w = canvas.clientWidth, hgt = 150;
    canvas.width = w*dpr; canvas.height = hgt*dpr;
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,hgt);
    ctx.fillStyle = 'rgba(146,153,172,.5)';
    ctx.font = '12px Inter'; ctx.fillText('No contributions logged yet across the family', 8, hgt/2);
    return;
  }
  const points = buildCumulativeCostBasisPoints(allTx);
  const totalValue = profiles.reduce((s,profile)=>s+portfolioTotals(profile).value,0);
  drawChartCore(canvas, points, totalValue, savingsVal);
}
 
function drawChartCore(canvas, costBasisPoints, finalValue, savingsVal){
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, hgt = 150;
  canvas.width = w*dpr; canvas.height = hgt*dpr;
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,hgt);
 
  const points = costBasisPoints.concat([{date:'today', val:finalValue}]);
 
  const maxV = Math.max(...points.map(pt=>pt.val), savingsVal, 1);
  const minV = 0;
  const padX=8, padY=14;
  const xStep = (w-padX*2)/(points.length-1||1);
  const yFor = v => hgt-padY - ((v-minV)/(maxV-minV||1))*(hgt-padY*2);
  const xFor = i => padX + i*xStep;
 
  // gradient area
  const grad = ctx.createLinearGradient(0,0,0,hgt);
  grad.addColorStop(0,'rgba(59,130,246,.35)');
  grad.addColorStop(1,'rgba(59,130,246,0)');
  ctx.beginPath();
  ctx.moveTo(xFor(0), hgt-padY);
  points.forEach((pt,i)=>ctx.lineTo(xFor(i), yFor(pt.val)));
  ctx.lineTo(xFor(points.length-1), hgt-padY);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
 
  // line
  ctx.beginPath();
  points.forEach((pt,i)=>{ i===0?ctx.moveTo(xFor(i),yFor(pt.val)):ctx.lineTo(xFor(i),yFor(pt.val)); });
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth=2; ctx.stroke();
 
  // dots for contributions
  ctx.fillStyle = '#e9ebf1';
  points.slice(0,-1).forEach((pt,i)=>{
    ctx.beginPath(); ctx.arc(xFor(i), yFor(pt.val), 3, 0, Math.PI*2); ctx.fill();
  });
  // current value marker
  const li = points.length-1;
  ctx.beginPath(); ctx.arc(xFor(li), yFor(points[li].val), 4, 0, Math.PI*2);
  ctx.fillStyle = '#22c55e'; ctx.fill();
 
  // savings dashed line
  ctx.beginPath();
  ctx.setLineDash([4,4]);
  ctx.moveTo(xFor(0), yFor(0));
  ctx.lineTo(xFor(li), yFor(savingsVal));
  ctx.strokeStyle = 'rgba(146,153,172,.7)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.setLineDash([]);
}
 
/* ---- Live prices via Claude API (web search) ---- */
// Common crypto tickers mapped to CoinGecko IDs. Crypto prices move fast and are
// exactly the kind of number an LLM can get wrong even with web search enabled
// (it can lean on a stale memorized figure instead of the actual search result),
// so for these we hit a free, keyless, direct price API rather than routing through
// the model at all — no room for the number to drift from what's actually current.
// Free, keyless FX lookup (ECB reference rates via frankfurter.app) for converting
// a purchase made in a foreign currency to EUR.
async function autoFetchFxRate(pk, updateTotalOut, updateFooter, renderList){
  if(pk.currency==='EUR'){ pk.fxRate=1; return; }
  const statusEl = document.getElementById(`fx-status-${pk.pid}`);
  if(statusEl) statusEl.textContent = 'Fetching automatically…';
  // Use the rate from the actual purchase date rather than today's — the ECB
  // reference data only covers business days, so a weekend/holiday date falls
  // back to the nearest prior rate automatically.
  const dateStr = pk.date || todayISO();
  const endpoint = dateStr===todayISO() ? 'latest' : dateStr;
  try{
    const resp = await fetch(`https://api.frankfurter.app/${endpoint}?from=${pk.currency}&to=EUR`);
    if(!resp.ok) throw new Error(`Frankfurter responded ${resp.status}`);
    const data = await resp.json();
    if(data.rates && typeof data.rates.EUR==='number'){
      pk.fxRate = data.rates.EUR;
      pk.fxFailed = false;
      const liveStatusEl = document.getElementById(`fx-status-${pk.pid}`);
      if(liveStatusEl) liveStatusEl.textContent = `1 ${pk.currency} = ${pk.fxRate.toFixed(4)} EUR (auto)`;
      const fallback = document.querySelector(`[data-fxfallback="${pk.pid}"]`);
      if(fallback) fallback.classList.add('hidden');
      updateTotalOut(pk);
      updateFooter();
    } else {
      throw new Error('No rate in response');
    }
  }catch(e){
    console.error('FX rate lookup failed', e);
    pk.fxFailed = true;
    const liveStatusEl = document.getElementById(`fx-status-${pk.pid}`);
    if(liveStatusEl) liveStatusEl.textContent = "Couldn't fetch a rate automatically — enter it below.";
    if(renderList) renderList();
  }
}

// Direct client-side calls to api.anthropic.com only work inside Claude's own
// artifact preview, where the key is injected invisibly. Hosted anywhere else
// (GitHub Pages, Netlify, etc.), this needs a real API key — stored locally,
// entered once in Settings — sent with the direct-browser-access header Anthropic
// requires for calls made straight from a browser rather than a server.
function anthropicHeaders(){
  return {
    'Content-Type':'application/json',
    'x-api-key': S.anthropicApiKey||'',
    'anthropic-version':'2023-06-01',
    'anthropic-dangerous-direct-browser-access':'true'
  };
}
function hasApiKey(){ return !!(S.anthropicApiKey && S.anthropicApiKey.trim()); }
 
async function refreshPrices(p){
  if(!p.assets.length) return;
  const btn = document.getElementById('refresh-prices');
  if(btn) btn.textContent = 'refreshing…';
 
  const cryptoAssets = p.assets.filter(a=>a.type==='Crypto' && CRYPTO_TICKER_TO_COINGECKO[a.ticker.toUpperCase()]);
  let otherAssets = p.assets.filter(a=>!(a.type==='Crypto' && CRYPTO_TICKER_TO_COINGECKO[a.ticker.toUpperCase()]));
 
  // Direct, keyless price feed for recognized crypto tickers. If this fails for
  // any reason (network restriction, CORS, rate limit — the failure mode varies
  // by where this page is hosted or being tested), fall through to the search-based
  // lookup below instead of leaving those assets with a stale price.
  if(cryptoAssets.length){
    try{
      const ids = [...new Set(cryptoAssets.map(a=>CRYPTO_TICKER_TO_COINGECKO[a.ticker.toUpperCase()]))].join(',');
      const resp = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=eur`);
      if(!resp.ok) throw new Error(`CoinGecko responded ${resp.status}`);
      const data = await resp.json();
      const failed = [];
      cryptoAssets.forEach(a=>{
        const cgId = CRYPTO_TICKER_TO_COINGECKO[a.ticker.toUpperCase()];
        if(data[cgId] && typeof data[cgId].eur==='number'){
          p.prices[a.id] = {price:data[cgId].eur, asOf:new Date().toISOString(), currency:'EUR'};
        } else {
          failed.push(a);
        }
      });
      if(failed.length) otherAssets = otherAssets.concat(failed);
    }catch(e){
      console.warn('CoinGecko direct fetch unavailable, falling back to search for crypto prices:', e);
      otherAssets = otherAssets.concat(cryptoAssets);
    }
  }
 
  // Everything else (ETFs, stocks, bonds, metals, or unrecognized/unreachable
  // crypto tickers) goes through Claude + web search, with an explicit instruction
  // not to answer from memory. Requires an API key configured in Settings when
  // this page is hosted outside Claude's own preview.
  if(otherAssets.length){
    if(!hasApiKey()){
      S.priceRefreshNote = 'Add an Anthropic API key in Settings to enable live lookups for non-crypto assets.';
    } else {
      const tickers = otherAssets.map(a=>`${a.id}:${a.ticker}`).join(', ');
      try{
        const resp = await fetch('https://api.anthropic.com/v1/messages', {
          method:'POST',
          headers: anthropicHeaders(),
          body: JSON.stringify({
            model: AI_MODEL,
            max_tokens: 1000,
            messages:[{role:'user', content:
              `Use web_search to look up today's current market prices in EUR for these assets (format id:ticker): ${tickers}. ` +
              `Do not answer from memory or approximate — only use figures you actually find via web_search, since prices change daily and a memorized value could be badly out of date. ` +
              `If you can't find a reliable current price for an item, omit it entirely rather than guessing. ` +
              `Respond with ONLY a JSON array, no markdown, no preamble, like: ` +
              `[{"id":"abc123","price":41.2,"asOf":"2026-09-11"}]`
            }],
            tools:[{type:'web_search_20250305', name:'web_search'}]
          })
        });
        if(!resp.ok){
          const errBody = await resp.text().catch(()=>'');
          throw new Error(`API responded ${resp.status}: ${errBody.slice(0,200)}`);
        }
        const data = await resp.json();
        const textBlock = (data.content||[]).map(c=>c.text||'').join('');
        const clean = textBlock.replace(/```json|```/g,'').trim();
        const match = clean.match(/\[[\s\S]*\]/);
        const arr = JSON.parse(match?match[0]:clean);
        arr.forEach(item=>{
          p.prices[item.id] = {price:item.price, asOf: new Date().toISOString(), currency:'EUR'};
        });
        S.priceRefreshNote = null;
      }catch(e){
        console.error('Price refresh failed', e);
        S.priceRefreshNote = 'Live lookup for non-crypto assets failed — check your API key in Settings, or try again shortly.';
      }
    }
  } else {
    S.priceRefreshNote = null;
  }
 
  saveState();
  render();
}

        </div>
      </div>
    </div>

      <label>Amount received (${d.currency})</label>
      <input type="number" id="div-amount" value="${d.amountEUR}" step="0.01" min="0" placeholder="0.00" />

    </div>
    <div class="field">
      <label>Note (optional)</label>
      <textarea id="div-reasoning" placeholder="e.g. Q3 dividend">${d.reasoning}</textarea>
    </div>
 
    <button class="btn btn-primary" id="div-save-btn" ${isValid?'':'disabled'}>Save & stamp</button>
  `;
 
  document.getElementById('cancel-dividend').onclick = ()=>{ S.dividendDraft=null; S.view='positions'; render(); };
  document.getElementById('div-asset-select').onchange = e=>{ d.assetId=e.target.value; render(); };

    const btn = document.getElementById('div-save-btn');

    btn.disabled = !valid;
    const preview = document.getElementById('div-eur-preview');
    if(d.currency!=='EUR'){

  };

    const finalEurAmount = d.currency==='EUR' ? (+d.amountEUR) : (+d.amountEUR)*(+d.fxRate);
    if(!((+d.amountEUR||0)>0) || (d.currency!=='EUR' && !((+d.fxRate||0)>0))) return;
    p.transactions.push({
      id:uid(), date:d.date, type:'dividend', bucket:pos.asset.bucket, assetId:pos.assetId,
      amountEUR: finalEurAmount, reasoning: d.reasoning,
      origCurrency: d.currency!=='EUR' ? d.currency : undefined,
      origAmount: d.currency!=='EUR' ? +d.amountEUR : undefined,
      fxRate: d.currency!=='EUR' ? +d.fxRate : undefined
    });
    S.dividendDraft=null; S.view='home'; saveState(); render();
  };
 
  if(d.currency!=='EUR' && !d.fxRate && !d.fxFailed) fetchDividendFx(p);
}
 
async function fetchDividendFx(p){
  const d = S.dividendDraft;
  if(!d || d.currency==='EUR') return;
  const statusEl = document.getElementById('div-fx-status');
  if(statusEl) statusEl.textContent = 'Fetching automatically…';
  const dateStr = d.date || todayISO();
  const endpoint = dateStr===todayISO() ? 'latest' : dateStr;
  try{
    const resp = await fetch(`https://api.frankfurter.app/${endpoint}?from=${d.currency}&to=EUR`);
    if(!resp.ok) throw new Error(`Frankfurter responded ${resp.status}`);
    const data = await resp.json();
    if(data.rates && typeof data.rates.EUR==='number'){
      d.fxRate = data.rates.EUR;
      d.fxFailed = false;
      const liveStatus = document.getElementById('div-fx-status');
      if(liveStatus) liveStatus.textContent = `1 ${d.currency} = ${d.fxRate.toFixed(4)} EUR (auto)`;
      const fallback = document.getElementById('div-fx-fallback');
      if(fallback) fallback.classList.add('hidden');
      const preview = document.getElementById('div-eur-preview');
      if(preview) preview.textContent = `≈ ${fmtEUR((+d.amountEUR||0)*d.fxRate)}`;
      const saveBtn = document.getElementById('div-save-btn');
      if(saveBtn) saveBtn.disabled = !((+d.amountEUR||0)>0);
    } else {
      throw new Error('No rate in response');
    }
  }catch(e){
    console.error('Dividend FX lookup failed', e);
    d.fxFailed = true;
    const liveStatus = document.getElementById('div-fx-status');
    if(liveStatus) liveStatus.textContent = "Couldn't fetch a rate automatically — enter it below.";
    const fallback = document.getElementById('div-fx-fallback');
    if(fallback) fallback.classList.remove('hidden');
  }
}
 
/* ---- Sell flow (register a sale you've already made) ---- */
function startSell(p, assetId){
  S.sellDraft = { assetId: assetId||null, sellAll:false, amountEUR:'', priceAtSell:null, fee:0, reasoning:'', date: todayISO() };
  S.view='sell';
  render();
}
 
function sellPreview(pos, d){
  if(!pos) return {unitsToSell:0, proceeds:0, realizedGain:0};
  let unitsToSell = d.sellAll ? pos.units : (d.amountEUR ? (+d.amountEUR/(d.priceAtSell||1)) : 0);
  unitsToSell = Math.max(0, Math.min(unitsToSell, pos.units));
  const avgCost = pos.units>0 ? pos.costBasis/pos.units : 0;
  const costRemoved = avgCost*unitsToSell;
  const proceeds = unitsToSell*(d.priceAtSell||0) - (d.fee||0);
  const realizedGain = proceeds - costRemoved;
  return {unitsToSell, proceeds, realizedGain};
}

    </div>

  `;
 
  document.getElementById('cancel-sell').onclick = ()=>{ S.sellDraft=null; S.view='positions'; render(); };
  document.getElementById('sell-asset-select').onchange = e=>{ d.assetId=e.target.value; d.priceAtSell=null; d.amountEUR=''; d.sellAll=false; renderSellFlow(main,p); };

  document.getElementById('sell-save-btn').onclick = ()=>{
    const finalPreview = sellPreview(pos, d);
    if(!(finalPreview.unitsToSell>0 && d.reasoning && d.priceAtSell>0)) return;
    p.transactions.push({
      id:uid(), date:d.date, type:'sell', bucket:pos.asset.bucket, assetId:pos.assetId,
      units:finalPreview.unitsToSell, priceAtSell:d.priceAtSell, fee:d.fee||0, reasoning:d.reasoning
    });
    S.sellDraft=null; S.view='home'; saveState(); render();
  };
}

  if(d.isDividend){

  } else if(d.isSell){

    document.getElementById('edit-price').oninput = e=>{ d.priceAtSell=Math.max(+e.target.value,0); };
  } else {
    document.getElementById('edit-amount').oninput = e=>{ d.amountEUR=Math.max(+e.target.value,0); updatePreview(); };
    document.getElementById('edit-price').oninput = e=>{ d.priceAtBuy=Math.max(+e.target.value,0); updatePreview(); };
  }
 
  document.getElementById('save-edit-btn').onclick = ()=>{
    if(d.isDividend){
      tx.date=d.date; tx.amountEUR=+d.amountEUR; tx.reasoning=d.reasoning;
    } else if(d.isSell){
      tx.date=d.date; tx.units=+d.units; tx.priceAtSell=+d.priceAtSell; tx.fee=+d.fee||0; tx.reasoning=d.reasoning;
    } else {
      tx.date=d.date; tx.amountEUR=+d.amountEUR; tx.priceAtBuy=+d.priceAtBuy; tx.fee=+d.fee||0; tx.reasoning=d.reasoning;
    }
    S.editTxDraft=null; S.view='positions'; saveState(); render();
  };
 
  if(d.confirmingDelete){
    document.getElementById('cancel-delete-btn').onclick = ()=>{ d.confirmingDelete=false; render(); };
    document.getElementById('confirm-delete-btn').onclick = ()=>{
      p.transactions = p.transactions.filter(t=>t.id!==d.txId);
      S.editTxDraft=null; S.view='positions'; saveState(); render();
    };
  } else {
    document.getElementById('delete-tx-btn').onclick = ()=>{ d.confirmingDelete=true; render(); };
  }
}
 
/* ---- Transaction history ---- */
function computeAssetEvolution(profile, assetId){
  const events = [];
  let units=0, costBasis=0;
  const sorted = profile.transactions.filter(t=>t.assetId===assetId).slice().sort((a,b)=>a.date.localeCompare(b.date));
  sorted.forEach(tx=>{
    if(tx.type==='sell'){
      const avgCost = units>0 ? costBasis/units : 0;
      const soldUnits = Math.min(tx.units||0, units);
      const costRemoved = avgCost*soldUnits;
      const proceeds = soldUnits*(tx.priceAtSell||0) - (tx.fee||0);
      const realizedGain = proceeds - costRemoved;
      units -= soldUnits; costBasis -= costRemoved;
      events.push({tx, runningUnits:Math.max(units,0), runningCostBasis:Math.max(costBasis,0), realizedGain, proceeds});
    } else if(tx.type==='dividend'){
      // Doesn't change units or cost basis — it's income, not a new purchase.
      events.push({tx, runningUnits:units, runningCostBasis:costBasis});
    } else {
      costBasis += tx.amountEUR + (tx.fee||0);
      units += unitsFor(tx);
      events.push({tx, runningUnits:units, runningCostBasis:costBasis});
    }
  });
  return events;
}
 
// Renders one asset's transaction timeline as an HTML fragment — reused both
// nowhere else historically standalone, but kept as a helper so the expandable
// row in the Assets view can lazily build this on demand.
function assetEvolutionHTML(p, assetId, editable){
  const events = computeAssetEvolution(p, assetId);
  if(!events.length) return '<div class="hint" style="padding:8px 0;">No transactions yet.</div>';
  return events.map(ev=>{
    const tx = ev.tx;
    const isSell = tx.type==='sell';
    const isDividend = tx.type==='dividend';
    const label = isSell ? 'Sold' : (isDividend ? 'Dividend' : 'Bought');
    const amount = isSell ? ev.proceeds : tx.amountEUR;
    return `<div class="evo-item ${isSell?'is-sell':''}${isDividend?' is-dividend':''}">
      <div class="evo-line" style="align-items:flex-start;">
        <div>
          <div class="evo-date">${tx.date}</div>
          <div style="margin-top:2px;">
            <span style="font-size:13px;font-weight:650;">${label} ${fmtEUR(amount)}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          ${isSell?`<span class="num ${ev.realizedGain>=0?'delta-up':'delta-down'}" style="font-size:12.5px;font-weight:650;">${fmtEUR(ev.realizedGain)}</span>`:''}
          ${editable?`<button data-edit-tx="${tx.id}" class="btn-ghost" style="width:auto;padding:4px 8px;font-size:11.5px;color:var(--accent-2);">Edit</button>`:''}
        </div>
      </div>
      ${isDividend?'':`<div class="evo-running">${ev.runningUnits.toFixed(4)} units held · cost basis ${fmtEUR(ev.runningCostBasis)}${tx.origCurrency?` · paid ${tx.origAmount.toFixed(2)} ${tx.origCurrency} @ rate ${tx.fxRate.toFixed(4)}`:''}</div>`}
      ${tx.reasoning?`<div class="evo-reason">${escapeHTML(tx.reasoning)}</div>`:''}
    </div>`;
  }).join('');
}
 
/* ---- Contribution flow (register purchases you've already made) ---- */
function startContribution(p, prefill){
  const first = freshPurchase(p, prefill?.bucket);
  if(prefill?.assetId) first.assetId = prefill.assetId;
  S.contribDraft = { purchases: [first] };
  S.view='contribute';
  render();
}
 
const FX_CURRENCIES = ['EUR','USD','GBP','CHF','JPY','PLN','CAD','AUD','SEK','NOK'];
 
function freshPurchase(p, bucket){
  return {pid:uid(), bucket: bucket||'long', assetId:null, newAsset:null, amountEUR:'', price:'', fee:0, reasoning:'', date: todayISO(), currency:'EUR', fxRate:1};
}
 
function purchaseEurAmount(pk){
  const rate = pk.currency==='EUR' ? 1 : (+pk.fxRate||0);
  return (+pk.amountEUR||0) * rate;
}
 
function purchaseIsValid(pk){
  if(!pk.bucket || !pk.assetId || !pk.reasoning || !pk.date) return false;
  if(!((+pk.amountEUR||0)>0) || !((+pk.price||0)>0)) return false;
  if(pk.currency!=='EUR' && !((+pk.fxRate||0)>0)) return false;
  if(pk.assetId==='__new__') return !!(pk.newAsset && pk.newAsset.name);
  return true;
}
 
function renderContributeFlow(main, p){
  const d = S.contribDraft;
  const purchases = d.purchases;
 
  main.innerHTML = `

    ${d.justSaved?`<div class="card card-sm" style="margin-bottom:14px;border-color:rgba(34,197,94,.35);background:var(--green-soft);"><span style="font-size:12.5px;font-weight:650;color:var(--green);">Saved ${d.justSaved} purchase${d.justSaved>1?'s':''} — finish this one whenever you're ready.</span></div>`:''}
 
    <div id="purchases-list"></div>

    </div>
 
    <button class="btn btn-primary" id="save-contrib" disabled>Save & stamp</button>
  `;
  delete d.justSaved;
 
  document.getElementById('cancel-contrib').onclick = ()=>{ S.contribDraft=null; S.view='home'; render(); };
 
  function updateFooter(){
    const totals = {long:0, div:0, spec:0};
    purchases.forEach(pk=>{ totals[pk.bucket] += purchaseEurAmount(pk); });
    const grandTotal = totals.long+totals.div+totals.spec;
    document.getElementById('grand-total-val').textContent = fmtEUR(grandTotal);
    document.getElementById('bucket-breakdown').innerHTML = grandTotal>0 ? `
      <span class="dot-long">Long ${fmtEUR(totals.long)}</span>
      <span class="dot-div">Div ${fmtEUR(totals.div)}</span>
      <span class="dot-spec">Spec ${fmtEUR(totals.spec)}</span>` : '';
    const readyCount = purchases.filter(purchaseIsValid).length;
    const saveBtn = document.getElementById('save-contrib');
    saveBtn.disabled = readyCount===0;
    saveBtn.textContent = readyCount>0 ? `Save ${readyCount} purchase${readyCount>1?'s':''} & stamp` : 'Save & stamp';
  }
 
  function renderList(){
    const list = document.getElementById('purchases-list');
    function updateTotalOut(pk){
      const el = document.getElementById(`total-out-${pk.pid}`);
      if(!el) return;
      const nativeTotal = (+pk.amountEUR||0) + (+pk.fee||0);
      if(pk.currency==='EUR'){
        el.textContent = `Total leaving your account: ${fmtEUR(nativeTotal)}`;
      } else {
        const rate = +pk.fxRate||0;
        const eurTotal = rate>0 ? (purchaseEurAmount(pk) + (+pk.fee||0)) : null;
        el.textContent = `Total leaving your account: ${nativeTotal.toFixed(2)} ${pk.currency}` + (eurTotal!==null ? ` (≈ ${fmtEUR(eurTotal)})` : (pk.fxFailed?' — enter a rate above to see the EUR equivalent':' — fetching exchange rate…'));
      }
    }
    list.innerHTML = purchases.map((pk,i)=>{
      const existingAssets = pk.bucket ? assetsFor(p, pk.bucket) : [];
      return `
      <div class="card card-sm" style="margin-bottom:12px;">
        ${purchases.length>1?`<div class="row" style="margin-bottom:10px;"><span style="font-size:12px;color:var(--text-faint);font-weight:650;">Purchase ${i+1}</span><button data-remove="${pk.pid}" class="btn-ghost" style="width:auto;padding:4px 8px;color:var(--red);font-size:12px;">Remove</button></div>`:''}
        <div class="field">
          <label>Bucket</label>
          <div class="chip-select" data-bucket-select="${pk.pid}">
            ${BUCKETS.map(b=>`<button data-bucket-opt="${b.id}" class="${pk.bucket===b.id?'active':''}">${b.short}</button>`).join('')}
          </div>
        </div>
        <div class="field">
          <label>Asset</label>
          <select data-asset="${pk.pid}">
            <option value="">— choose —</option>
            ${existingAssets.map(a=>`<option value="${a.id}" ${pk.assetId===a.id?'selected':''}>${a.ticker!==a.name?a.ticker+' — '+a.name:a.name}</option>`).join('')}
            <option value="__new__" ${pk.assetId==='__new__'?'selected':''}>+ Add new asset</option>
          </select>
        </div>
        <div data-newfields="${pk.pid}" class="${pk.assetId==='__new__'?'':'hidden'}">
          <div class="field-row">
            <div class="field">
              <label>${pk.newAsset?.type==='Crypto'?'Symbol (e.g. BTC)':'What\'s it called?'}</label>
              <input type="text" data-na-name="${pk.pid}" value="${pk.newAsset?.name||''}" placeholder="${pk.newAsset?.type==='Crypto'?'e.g. BTC':'e.g. Vanguard FTSE All-World'}" />
            </div>
            <div class="field"><label>Type</label>
              <select data-na-type="${pk.pid}">${ASSET_TYPES.map(t=>`<option ${pk.newAsset?.type===t?'selected':''}>${t}</option>`).join('')}</select>
            </div>
          </div>
          ${pk.newAsset?.type==='Crypto'?'<div class="hint" style="margin:-4px 0 12px;">Use the standard symbol (BTC, ETH, etc.) so live pricing can find it automatically.</div>':''}
        </div>
        <div class="field-row">
          <div class="field">
            <label>Currency</label>
            <select data-currency="${pk.pid}">${FX_CURRENCIES.map(c=>`<option ${pk.currency===c?'selected':''}>${c}</option>`).join('')}</select>
          </div>
          <div class="field ${pk.currency==='EUR'?'hidden':''}">
            <label>Rate to EUR</label>
            <div class="hint" id="fx-status-${pk.pid}" style="margin-top:11px;">Fetching automatically…</div>
            <div class="${pk.fxFailed?'':'hidden'}" data-fxfallback="${pk.pid}" style="margin-top:6px;display:flex;gap:6px;">
              <input type="number" data-fxrate="${pk.pid}" value="${pk.fxRate||''}" step="0.0001" min="0" placeholder="Enter rate manually" style="flex:1;" />
              <button data-fxlookup="${pk.pid}" class="btn-ghost" style="width:auto;padding:0 10px;font-size:11.5px;">Retry</button>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Price per unit paid (${pk.currency})</label><input type="number" data-price="${pk.pid}" value="${pk.price}" step="0.01" min="0" /></div>
          <div class="field"><label>Order value (${pk.currency})</label><input type="number" data-amount="${pk.pid}" value="${pk.amountEUR}" step="0.01" min="0" placeholder="0.00" /></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Date of purchase</label><input type="date" data-date="${pk.pid}" value="${pk.date}" max="${todayISO()}" /></div>
          <div class="field"><label>Fee (${pk.currency}) — added on top</label><input type="number" data-fee="${pk.pid}" value="${pk.fee}" step="0.01" min="0" /></div>
