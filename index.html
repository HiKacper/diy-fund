        <div class="field">
          <div class="hint" id="total-out-${pk.pid}"></div>
        </div>
        <div class="field">
          <label>Why this pick? (required)</label>
          <textarea data-reasoning="${pk.pid}" placeholder="What's your reasoning?">${pk.reasoning}</textarea>
        </div>
      </div>`;
    }).join('');
 
    purchases.forEach(pk=>{
      list.querySelectorAll(`[data-bucket-select="${pk.pid}"] [data-bucket-opt]`).forEach(btn=>{
        btn.onclick = ()=>{
          if(pk.bucket===btn.dataset.bucketOpt) return;
          pk.bucket = btn.dataset.bucketOpt;
          pk.assetId = null; pk.newAsset = null; // asset choices are bucket-scoped
          renderList(); updateFooter();
        };
      });
      const sel = list.querySelector(`[data-asset="${pk.pid}"]`);
      sel.onchange = e=>{
        pk.assetId = e.target.value;
        if(pk.assetId==='__new__'){
          if(!pk.newAsset) pk.newAsset={type:'ETF',name:''};
        } else if(pk.assetId) {
          const known = currentPrice(p, pk.assetId);
          if(known) pk.price = known; // prefill with last known price, still editable
        }
        renderList(); updateFooter();
      };
      if(pk.assetId==='__new__'){
        list.querySelector(`[data-na-type="${pk.pid}"]`).onchange = e=>{ pk.newAsset.type=e.target.value; renderList(); };
        list.querySelector(`[data-na-name="${pk.pid}"]`).oninput = e=>{ pk.newAsset.name=e.target.value; updateFooter(); };
      }
      list.querySelector(`[data-currency="${pk.pid}"]`).onchange = e=>{
        pk.currency = e.target.value;
        if(pk.currency==='EUR'){ pk.fxRate = 1; pk.fxFailed=false; }
        else { pk.fxRate = 0; pk.fxFailed = false; } // unknown until the auto-fetch resolves
        renderList(); updateFooter();
        if(pk.currency!=='EUR') autoFetchFxRate(pk, updateTotalOut, updateFooter, renderList);
      };
      const fxInput = list.querySelector(`[data-fxrate="${pk.pid}"]`);
      if(fxInput) fxInput.oninput = e=>{ pk.fxRate=Math.max(+e.target.value,0); updateTotalOut(pk); updateFooter(); };
      const fxBtn = list.querySelector(`[data-fxlookup="${pk.pid}"]`);
      if(fxBtn) fxBtn.onclick = ()=>autoFetchFxRate(pk, updateTotalOut, updateFooter, renderList);
      list.querySelector(`[data-price="${pk.pid}"]`).oninput = e=>{ pk.price=e.target.value===''?'':Math.max(+e.target.value,0); updateFooter(); };
      list.querySelector(`[data-amount="${pk.pid}"]`).oninput = e=>{ pk.amountEUR=e.target.value===''?'':Math.max(+e.target.value,0); updateTotalOut(pk); updateFooter(); };
      list.querySelector(`[data-fee="${pk.pid}"]`).oninput = e=>{ pk.fee=Math.max(+e.target.value,0); updateTotalOut(pk); };
      list.querySelector(`[data-date="${pk.pid}"]`).onchange = e=>{
        pk.date=e.target.value; updateFooter();
        if(pk.currency!=='EUR') autoFetchFxRate(pk, updateTotalOut, updateFooter, renderList);
      };
      list.querySelector(`[data-reasoning="${pk.pid}"]`).oninput = e=>{ pk.reasoning=e.target.value; updateFooter(); };
      updateTotalOut(pk);
      if(pk.currency!=='EUR' && !pk.fxRate && !pk.fxFailed) autoFetchFxRate(pk, updateTotalOut, updateFooter, renderList);
      const removeBtn = list.querySelector(`[data-remove="${pk.pid}"]`);
      if(removeBtn) removeBtn.onclick = ()=>{
        d.purchases = purchases.filter(x=>x.pid!==pk.pid);
        renderContributeFlow(main, p);
      };
    });
  }
 
  renderList();
  updateFooter();
 
  document.getElementById('add-purchase').onclick = ()=>{
    purchases.push(freshPurchase(p));
    renderContributeFlow(main, p);
  };
 
  document.getElementById('save-contrib').onclick = ()=>{
    const ready = purchases.filter(purchaseIsValid);
    if(!ready.length) return; // shouldn't happen since button is disabled, but guard anyway
    ready.forEach(pk=>{
      const fxRate = pk.currency==='EUR' ? 1 : (+pk.fxRate||0);
      const eurPrice = (+pk.price)*fxRate;
      const eurAmount = (+pk.amountEUR)*fxRate;
      const eurFee = (+pk.fee||0)*fxRate;
 
      if(pk.assetId==='__new__'){
        const na = pk.newAsset;
        const newId = uid();
        p.assets.push({id:newId, ticker:na.name, name:na.name, bucket:pk.bucket, type:na.type, reyndersPct: na.type==='Bond'?50:0});
        p.prices[newId] = {price:eurPrice, asOf:new Date().toISOString(), currency:'EUR'};
        pk.finalAssetId = newId;
      } else {
        pk.finalAssetId = pk.assetId;
        // Only let this purchase's price become the newly tracked current price if
        // it's actually the most recent data point we have — a backdated entry
        // shouldn't overwrite a more recent live-refreshed or later-dated price.
        const existing = p.prices[pk.assetId];
        const newAsOf = new Date(pk.date).toISOString();
        if(!existing || newAsOf >= existing.asOf){
          p.prices[pk.assetId] = {price:eurPrice, asOf:newAsOf, currency:'EUR'};
        }
      }
      p.transactions.push({
        id:uid(), date:pk.date||todayISO(), bucket:pk.bucket, assetId:pk.finalAssetId,
        amountEUR: eurAmount, priceAtBuy: eurPrice, reasoning: pk.reasoning, fee: eurFee,
        origCurrency: pk.currency!=='EUR' ? pk.currency : undefined,
        origAmount: pk.currency!=='EUR' ? +pk.amountEUR : undefined,
        origPrice: pk.currency!=='EUR' ? +pk.price : undefined,
        fxRate: pk.currency!=='EUR' ? fxRate : undefined
      });
    });
    saveState();
    // Leave any incomplete entries in the draft so they can be finished later; only clear if all were saved.
    d.purchases = purchases.filter(pk=>!purchaseIsValid(pk));
    if(d.purchases.length===0){
      S.contribDraft=null; S.view='home'; render();
    } else {
      d.justSaved = ready.length;
      renderContributeFlow(main, p);
    }
  };
}

/* ---- Export to Excel ---- */
function monthRangeArray(startDate, endDate){
  const months = [];
  let d = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  const end = new Date(endDate.getFullYear(), endDate.getMonth(), 1);
  while(d<=end){
    months.push({y:d.getFullYear(), m:d.getMonth(), label:d.toLocaleDateString('en-US',{month:'short',year:'numeric'})});
    d = new Date(d.getFullYear(), d.getMonth()+1, 1);
  }
  return months;
}
 
function scopeTransactions(scope){
  if(scope.type==='family'){
    const profiles = scope.includeHidden ? S.profiles : S.profiles.filter(pr=>!pr.hidden);
    const all = [];
    profiles.forEach(profile=>profile.transactions.forEach(tx=>all.push({profile,tx})));
    return all;
  }
  return scope.profile.transactions.map(tx=>({profile:scope.profile, tx}));
}
 
function startExport(scope){
  const pairs = scopeTransactions(scope);
  const today = new Date();
  let minDate = today;
  pairs.forEach(({tx})=>{ const d=new Date(tx.date); if(d<minDate) minDate=d; });
  if(!pairs.length) minDate = today;
  const months = monthRangeArray(minDate, today);
  S.exportDraft = { scope, months, startIdx:0, endIdx: months.length-1 };
  S.view='export';
  render();
}
 
function renderExport(main){
  const d = S.exportDraft;
  if(!d){ S.view='positions'; render(); return; }
  const months = d.months;
  const backView = d.scope.type==='family' ? 'positions' : 'positions';
 
  main.innerHTML = `
    <div class="back-row"><button id="cancel-export">✕ Cancel</button></div>
    <div class="page-title" style="margin-bottom:4px;">Export report</div>
    <p class="hint" style="margin:0 0 16px;">${d.scope.type==='family'?'Combined across all accounts.':`For ${escapeHTML(d.scope.profile.name)}.`}</p>
 
    <div class="range-preset-row">
      <button data-preset="this-month">This month</button>
      <button data-preset="last-3">Last 3 months</button>
      <button data-preset="last-6">Last 6 months</button>
      <button data-preset="ytd">This year</button>
      <button data-preset="all">All time</button>
    </div>
 
    <div class="card">
      <div class="card-title" style="margin-bottom:0;">Period</div>
      <div class="row" style="margin-top:10px;font-size:13px;font-weight:650;">
        <span id="range-label-start">${months[d.startIdx]?.label||''}</span>
        <span style="color:var(--text-faint);">to</span>
        <span id="range-label-end">${months[d.endIdx]?.label||''}</span>

        <div class="track-fill" id="range-fill"></div>
        <input type="range" id="range-start" min="0" max="${Math.max(months.length-1,0)}" value="${d.startIdx}" />
        <input type="range" id="range-end" min="0" max="${Math.max(months.length-1,0)}" value="${d.endIdx}" />
      </div>
    </div>
 
    <button class="btn btn-primary" id="download-btn" style="margin-top:16px;" ${months.length?'':'disabled'}>Download Excel (.xlsx)</button>
    ${!months.length?'<div class="empty-state">No transactions yet to export.</div>':''}
  `;
 
  document.getElementById('cancel-export').onclick = ()=>{ S.exportDraft=null; S.view=backView; render(); };
 
  const startInput = document.getElementById('range-start');
  const endInput = document.getElementById('range-end');
  function updateSlider(){
    let s = +startInput.value, e = +endInput.value;
    if(s>e){ [s,e] = [e,s]; }
    d.startIdx = s; d.endIdx = e;
    document.getElementById('range-label-start').textContent = months[s]?.label||'';
    document.getElementById('range-label-end').textContent = months[e]?.label||'';
    const max = Math.max(months.length-1,1);
    const fill = document.getElementById('range-fill');
    fill.style.left = (s/max*100)+'%';
    fill.style.width = ((e-s)/max*100)+'%';
    document.querySelectorAll('.range-preset-row button').forEach(b=>b.classList.remove('active'));
  }
  if(months.length){
    startInput.oninput = ()=>{ if(+startInput.value > +endInput.value) startInput.value = endInput.value; updateSlider(); };
    endInput.oninput = ()=>{ if(+endInput.value < +startInput.value) endInput.value = startInput.value; updateSlider(); };
    updateSlider();
  }
 
  function setPreset(startIdx, endIdx){
    startInput.value = startIdx; endInput.value = endIdx;
    updateSlider();
  }
  document.querySelectorAll('[data-preset]').forEach(btn=>{
    btn.onclick = ()=>{

      if(btn.dataset.preset==='this-month'){ setPreset(lastIdx, lastIdx); }

      else if(btn.dataset.preset==='all'){ setPreset(0, lastIdx); }
      btn.classList.add('active');

  });
 
  document.getElementById('download-btn').onclick = ()=>downloadExportExcel(d);

function generateReportRows(scope, months, startIdx, endIdx){
  const startKey = months[startIdx].y*12+months[startIdx].m;
  const endKey = months[endIdx].y*12+months[endIdx].m;
  const profiles = scope.type==='family' ? (scope.includeHidden ? S.profiles : S.profiles.filter(pr=>!pr.hidden)) : [scope.profile];
  const rows = [];
  profiles.forEach(profile=>{
    const assetIds = [...new Set(profile.transactions.map(t=>t.assetId))];
    assetIds.forEach(assetId=>{
      // Even if the asset record is somehow missing (shouldn't normally happen),
      // still include its transactions rather than silently dropping them —
      // otherwise this total could quietly disagree with "Invested so far",
      // which counts every transaction regardless of asset lookup.
      const asset = profile.assets.find(a=>a.id===assetId);
      computeAssetEvolution(profile, assetId).forEach(ev=>{
        const tx = ev.tx;
        const txDate = new Date(tx.date);
        const key = txDate.getFullYear()*12+txDate.getMonth();
        if(key<startKey || key>endKey) return;
        const isSell = tx.type==='sell';
        const isDividend = tx.type==='dividend';
        const bucket = BUCKETS.find(b=>b.id===tx.bucket);
        rows.push({
          'Date': tx.date,
          'Account': profile.name,
          'Bucket': bucket?bucket.short:'',
          'Asset': asset?asset.name:'(unknown asset)',
          'Action': isSell?'Sell':(isDividend?'Dividend':'Buy'),
          'Amount (EUR)': isSell ? +ev.proceeds.toFixed(2) : +tx.amountEUR.toFixed(2),
          'Price per unit (EUR)': isSell ? tx.priceAtSell : (isDividend?'':tx.priceAtBuy),
          'Fee (EUR)': tx.fee||0,
          'Original currency': tx.origCurrency||'',
          'Original amount': tx.origAmount||'',
          'Units held after': isDividend?'':+ev.runningUnits.toFixed(6),
          'Cost basis after (EUR)': isDividend?'':+ev.runningCostBasis.toFixed(2),
          'Realized gain/loss (EUR)': isSell ? +ev.realizedGain.toFixed(2) : '',
          'Reasoning': tx.reasoning||''
        });
      });
    });
  });
  rows.sort((a,b)=>a.Date.localeCompare(b.Date));
  return rows;
}
 
function downloadExportExcel(d){
  const rows = generateReportRows(d.scope, d.months, d.startIdx, d.endIdx);
  if(!rows.length){ alert('No transactions in that period.'); return; }
  if(typeof XLSX==='undefined'){ alert("Couldn't load the Excel library — check your connection and try again."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Transactions');
  const label = d.scope.type==='family' ? 'family' : d.scope.profile.name.replace(/[^a-z0-9]/gi,'');
  const filename = `diy-fund-${label}-${d.months[d.startIdx].label.replace(' ','')}-${d.months[d.endIdx].label.replace(' ','')}.xlsx`;
  XLSX.writeFile(wb, filename);
}

          </div>`);

            <span class="num delta-up">${fmtEUR(pos.dividendsReceived)}</span>

      }).join(''):'<div class="empty-state" style="padding:10px 0;">No gains or completed sells yet.</div>'}

        <span>of <b>${fmtEUR(sum.exemption)}</b></span>

    </div>
    <div class="card card-sm">

    if(familyCanvas) drawDonutChart(familyCanvas, familySlices);
  }
}
 
function buildFamilySlices(includeHidden){
  const counters = {long:0, div:0, spec:0};
  const combined = {};
  const profiles = includeHidden ? S.profiles : S.profiles.filter(pr=>!pr.hidden);
  profiles.forEach(profile=>{
    positionsFor(profile).filter(pos=>pos.asset && pos.value>0.0001).forEach(pos=>{
      const key = pos.asset.bucket+':'+pos.asset.ticker;
      if(!combined[key]) combined[key] = {label:pos.asset.ticker, bucket:pos.asset.bucket, value:0};
      combined[key].value += pos.value;
    });
  });
  return Object.values(combined)
    .map(item=>{
      const idx = counters[item.bucket]++;
      return {label:item.label, value:item.value, color:assetSliceColor(item.bucket, idx)};
    })
    .sort((a,b)=>b.value-a.value);
}

    {q:'What is tax on investment gains, generally?', a:'Most countries tax the profit you make when an investment grows in value — a "capital gain." The exact rates, exemptions, and rules vary hugely by country, but the basic idea is the same everywhere: you\'re taxed on the gain itself, not on the money you originally put in.'},
    {q:'What does "tax-efficient" investing mean?', a:'Making sensible choices about when and how you realize gains, given the rules where you live — using any tax-free allowances, avoiding unnecessary buying and selling, and understanding which asset types get taxed differently. It\'s not about avoiding tax illegally — it\'s about not paying more than you actually have to.'},
    {q:'Belgium\'s tax regime for this plan', a:'Since 2026, Belgium taxes capital gains on financial assets at a flat 10% — but the first €10,000 of gains each person makes in a year is exempt, and it only counts once you actually sell (a realized gain), not just when a holding goes up on paper.'},
    {q:'Belgium\'s extra rule for bond-heavy funds', a:'On top of the standard regime, Belgium has a long-standing additional rule (officially called the "Reynders tax") that applies specifically to the interest-earning portion of bond funds, taxed separately at 30%. It\'s why bond fund gains get flagged apart from everything else in the Tax tab.'},
  ]},
];
function renderLearn(main){
  if(!S.expandedLearnCats) S.expandedLearnCats = {};
  main.innerHTML = `<div class="page-title">Learn</div>` + LEARN_CONTENT.map((cat,i)=>{
    const expanded = !!S.expandedLearnCats[i];
    return `
    <div class="learn-cat">
      <div class="learn-cat-head" data-learncat="${i}">
        <h3 style="margin:0;">${cat.cat}</h3>
        <span class="learn-cat-arrow ${expanded?'open':''}">›</span>
      </div>
      <div class="${expanded?'':'hidden'}" data-learnbody="${i}">
        ${cat.items.map(it=>`<details class="entry"><summary>${it.q}</summary><p>${it.a}</p></details>`).join('')}
      </div>
    </div>`;
  }).join('');
  main.querySelectorAll('[data-learncat]').forEach(row=>{
    row.onclick = ()=>{
      const i = row.dataset.learncat;
      S.expandedLearnCats[i] = !S.expandedLearnCats[i];
      render();
    };
  });
}
 
function escapeHTML(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
 
/* ---------------------------- Boot ---------------------------- */
render();
window.addEventListener('resize', ()=>{ if(S.view==='home') render(); });
 
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
